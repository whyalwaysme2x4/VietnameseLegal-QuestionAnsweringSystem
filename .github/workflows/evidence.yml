name: Validate evidence
on:
  pull_request:
  push:
    branches: [main]
    tags: ['w0*']
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute saved metrics and validate artifact hashes
        run: python Evidence/tools/validate_evidence.py
      - name: Validate W06 agent cases, fixture traces and code hashes
        run: python Evidence/tools/validate_w06.py
